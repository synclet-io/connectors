name: Release Please

# Keeps one release pull request open per connector with unreleased changes. Merging it bumps the
# connector's meta.json and CHANGELOG.md and creates the tag <dir>-v<version>, which runs release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Tags and pull requests created with GITHUB_TOKEN start no workflows, so release.yml and CI
      # would never run for them; the App's token does not have that limit.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.REGISTRY_DISPATCH_APP_ID }}
          private-key: ${{ secrets.REGISTRY_DISPATCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
