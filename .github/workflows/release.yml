name: Release

# One connector per tag: pushing <dir>-v<version> (for example source-postgres-v0.2.0) releases
# connectors/<dir> at that version. meta.json must declare the same version.
on:
  push:
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)run, e.g. source-postgres-v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      connector: ${{ steps.release.outputs.connector }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate
        run: go run ./scripts validate

      - name: Resolve the tag to a connector
        id: release
        run: |
          RELEASE=$(go run ./scripts release --tag "$TAG")
          echo "$RELEASE" | jq .
          echo "connector=$(echo "$RELEASE" | jq -r .connector)" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$RELEASE" | jq -r .version)" >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      repo: ${{ steps.image.outputs.repo }}
    env:
      CONNECTOR: ${{ needs.plan.outputs.connector }}
      VERSION: ${{ needs.plan.outputs.version }}
      DIR: connectors/${{ needs.plan.outputs.connector }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Resolve image name
        id: image
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}/$CONNECTOR"
          {
            echo "repo=$REPO"
            echo "license=$(jq -r .license "$DIR/meta.json")"
            echo "title=$(jq -r .name "$DIR/meta.json")"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for the pre-push spec check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.DIR }}
          platforms: linux/amd64
          load: true
          tags: local/${{ env.CONNECTOR }}:check
          cache-from: type=gha,scope=${{ env.CONNECTOR }}

      - name: spec.json matches the image
        run: |
          if ! diff -u <(jq -S . "$DIR/spec.json") <(docker run --rm --network none "local/$CONNECTOR:check" spec | jq -S 'select(.type == "SPEC") | .spec'); then
            echo "::error file=$DIR/spec.json::spec.json is out of date; run: task spec CONNECTOR=$CONNECTOR"
            exit 1
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.DIR }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}:${{ env.VERSION }}
            ${{ steps.image.outputs.repo }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=${{ steps.image.outputs.title }}
            org.opencontainers.image.licenses=${{ steps.image.outputs.license }}
          cache-from: type=gha,scope=${{ env.CONNECTOR }}
          cache-to: type=gha,mode=max,scope=${{ env.CONNECTOR }}

      - name: Run spec on the pushed image (amd64 and arm64)
        env:
          IMAGE: ${{ steps.image.outputs.repo }}:${{ env.VERSION }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$IMAGE"
            if ! diff -u <(jq -S . "$DIR/spec.json") <(docker run --rm --network none --platform "$platform" "$IMAGE" spec | jq -S 'select(.type == "SPEC") | .spec'); then
              echo "::error file=$DIR/spec.json::$IMAGE ($platform) reports a spec that differs from spec.json; run: task spec CONNECTOR=$CONNECTOR"
              exit 1
            fi
          done

      # Synclet pulls connector images anonymously, so a registry entry for a private image is unusable.
      - name: Image is publicly pullable
        env:
          REPO: ${{ steps.image.outputs.repo }}
        run: |
          NAME=${REPO#ghcr.io/}
          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:$NAME:pull" | jq -r .token)
          if ! curl -fsS -o /dev/null -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/$NAME/manifests/$VERSION"; then
            echo "::error::$REPO is not public. Make the package public (Packages -> $CONNECTOR -> Package settings -> Change visibility), then re-run this workflow for $TAG."
            exit 1
          fi
