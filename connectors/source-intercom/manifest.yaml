# yaml-language-server: $schema=../source-declarative/internal/manifest/manifest.schema.json
version: 1
connector:
  name: source-intercom
  documentation_url: https://github.com/synclet-io/connectors/tree/main/connectors/source-intercom
base_url: https://api.intercom.io/
spec:
  title: Intercom Source Spec
  description: Reads admins, teams, tags, segments, data attributes, contacts and conversations from the Intercom REST API.
  required: [access_token]
  properties:
    access_token: {type: string, title: Access token, description: "Access token of an Intercom app, sent as a Bearer token. It needs read access to every selected stream.", secret: true, order: 0}
auth: {type: bearer, token: "{{ config.access_token }}"}
headers: {Intercom-Version: "2.11"}
errors: {message: "$.errors[0].message"}
retry:
  transient: {statuses: [500, 502, 503, 504], attempts: 3, backoff: 1s}
  rate_limit:
    statuses: [429]
    wait: ["header:Retry-After", "header-epoch:X-RateLimit-Reset", 10s]
    attempts: 5
check: {stream: admins}
streams:
  - name: admins
    path: admins
    primary_key: [id]
    schema: schemas/admins.json
    records: {path: $.admins}
  - name: teams
    path: teams
    primary_key: [id]
    schema: schemas/teams.json
    records: {path: $.teams}
  - name: tags
    path: tags
    primary_key: [id]
    schema: schemas/tags.json
    records: {path: $.data}
  - name: segments
    path: segments
    params: {include_count: "true"}
    primary_key: [id]
    schema: schemas/segments.json
    records: {path: $.segments}
  - name: data_attributes
    path: data_attributes
    primary_key: [model, full_name]
    schema: schemas/data_attributes.json
    records: {path: $.data}
  - name: contacts
    path: contacts
    primary_key: [id]
    schema: schemas/contacts.json
    records: {path: $.data}
    pagination: {type: cursor, cursor_from: $.pages.next.starting_after, cursor_param: starting_after, size: 150, size_param: per_page}
  - name: conversations
    path: conversations
    primary_key: [id]
    schema: schemas/conversations.json
    records: {path: $.conversations}
    pagination: {type: cursor, cursor_from: $.pages.next.starting_after, cursor_param: starting_after, size: 150, size_param: per_page}
