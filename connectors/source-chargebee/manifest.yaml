# yaml-language-server: $schema=../source-declarative/internal/manifest/manifest.schema.json
version: 1
connector:
  name: source-chargebee
  documentation_url: https://github.com/synclet-io/connectors/tree/main/connectors/source-chargebee
base_url: https://{{ config.site }}.chargebee.com/api/v2/
spec:
  title: Chargebee Source Spec
  description: Reads customers, subscriptions, invoices, credit notes, transactions, items, item prices and coupons from the Chargebee API v2, deleted objects included.
  required: [site, site_api_key, start_date]
  properties:
    site:         {type: string, title: Site, description: "The site name, the subdomain of <site>.chargebee.com.", pattern: "^[a-z0-9][a-z0-9-]*$", examples: ["example-test"], order: 0}
    site_api_key: {type: string, title: API key, description: "A full-access or read-only API key of the site, sent as the Basic auth username.", secret: true, order: 1}
    start_date:   {type: string, title: Start date, description: "Objects last updated before it are not read.", format: date-time, examples: ["2026-01-01T00:00:00Z"], order: 2}
auth: {type: basic, username: "{{ config.site_api_key }}", password: ""}
errors: {message: $.message}
check: {stream: customers}
params: {"sort_by[asc]": updated_at, include_deleted: "true"}
streams:
  - &list
    name: customers
    path: customers
    params: {"updated_at[after]": "{{ since }}"}
    primary_key: [id]
    schema: schemas/customers.json
    records: {path: "$.list[*].customer"}
    pagination: {type: cursor, cursor_from: $.next_offset, cursor_param: offset, size: 100, size_param: limit}
    incremental: {cursor_field: updated_at, cursor_format: unix_s, start: "{{ config.start_date }}", lookback: 1h}
  - <<: *list
    name: subscriptions
    path: subscriptions
    schema: schemas/subscriptions.json
    records: {path: "$.list[*].subscription"}
  - <<: *list
    name: invoices
    path: invoices
    schema: schemas/invoices.json
    records: {path: "$.list[*].invoice"}
  - <<: *list
    name: credit_notes
    path: credit_notes
    schema: schemas/credit_notes.json
    records: {path: "$.list[*].credit_note"}
  - <<: *list
    name: transactions
    path: transactions
    schema: schemas/transactions.json
    records: {path: "$.list[*].transaction"}
  - <<: *list
    name: items
    path: items
    schema: schemas/items.json
    records: {path: "$.list[*].item"}
  - <<: *list
    name: item_prices
    path: item_prices
    schema: schemas/item_prices.json
    records: {path: "$.list[*].item_price"}
  - <<: *list
    name: coupons
    path: coupons
    schema: schemas/coupons.json
    records: {path: "$.list[*].coupon"}
